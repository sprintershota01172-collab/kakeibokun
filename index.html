<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="出費をすばやく記録し、カード請求と家計を整理するオフライン家計簿">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>カケイボくん</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">K</span><span class="brand-name">カケイボくん<small>PRIVATE FINANCE</small></span></div>
      <div class="header-actions"><span id="today-chip" class="date-chip"></span><button id="settings-btn" class="icon-btn" type="button" aria-label="設定">⚙</button></div>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="画面切り替え">
      <button type="button" data-tab="home" class="nav-btn active"><span class="nav-ico">⌂</span><span>ホーム</span></button>
      <button type="button" data-tab="input" class="nav-btn"><span class="nav-ico">＋</span><span>入力</span></button>
      <button type="button" data-tab="trip" class="nav-btn"><span class="nav-ico">▣</span><span>出張</span></button>
      <button type="button" data-tab="cards" class="nav-btn"><span class="nav-ico">▤</span><span>カード</span></button>
      <button type="button" data-tab="household" class="nav-btn"><span class="nav-ico">▦</span><span>家計</span></button>
    </nav>
  </div>
  <div id="overlay" class="overlay hidden" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="close-modal" type="button" aria-label="閉じる">×</button></div><div id="modal-body" class="modal-body"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <noscript>JavaScriptを有効にしてください。</noscript>
</body>
</html>
